<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agent 9 • HeySalad</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#171717;font-family:Arial,sans-serif}aside{position:fixed;inset:0 auto 0 0;width:232px;border-right:1px solid #e5e5e5;padding:32px 25px}aside img{width:145px}aside h2{font-size:23px;margin-top:45px}nav button{display:block;text-align:left;border:0;background:white;color:#666;font-size:15px;padding:13px 0;width:100%;cursor:pointer}nav button[aria-current=true]{color:#111;font-weight:bold}main{margin-left:232px;display:flex;justify-content:center}.content{width:580px;padding:45px 0 30px}.brand{height:35px;max-width:150px}.top{display:flex;justify-content:space-between;align-items:center}.test{font-size:13px;color:#555;border:1px solid #ccc;border-radius:5px;padding:7px}h1{font-size:34px;letter-spacing:-1px;margin:45px 0 8px}p.sub{font-size:18px;color:#555;margin:0 0 30px}.request{border:1px solid #d5d5d5;border-radius:10px;padding:20px}label{display:block;font-weight:bold;font-size:16px;margin-bottom:12px}textarea{resize:none;width:100%;height:90px;font:19px/1.4 Arial;border:0;outline:none;background:#fff;color:#171717}button.send{display:block;margin:12px 0 0 auto;background:#151515;color:#fff;border:0;border-radius:7px;padding:12px 22px;font-size:16px;cursor:pointer}button:disabled{opacity:.6}.state{font-size:17px;line-height:1.45;margin:22px 0;color:#555;min-height:48px}.state strong{color:#111}.proof{border:1px solid #ccc;border-radius:10px;overflow:hidden}.proof h2{font-size:18px;margin:0;padding:17px 20px;border-bottom:1px solid #ddd}.proof pre{padding:18px 20px;font:16px/1.65 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}.empty{padding:25px 20px;color:#666;font-size:17px}.audit{border-top:1px solid #ddd;padding:14px 20px;font:14px/1.6 monospace;overflow-wrap:anywhere}footer{font-size:13px;color:#777;margin-top:24px}
</style></head><body><aside><img src="/agent9-logo.svg" alt="HeySalad"><h2>Agent 9</h2><nav></nav></aside><main><div class="content"><div class="top"><img class="brand" src="/agent9-logo.svg" alt="HeySalad"><span class="test">Stripe test mode</span></div><h1></h1><p class="sub">Your agent's financial operating system.</p><form class="request"><label for="command">Ask Sally</label><textarea id="command" aria-label="Ask Sally"></textarea><button class="send" type="submit">Send request</button></form><div class="state" role="status"></div><section class="proof"><h2>Stripe output</h2><div class="empty">No Stripe object for this request yet.</div><pre hidden></pre><div class="audit" hidden></div></section><footer>Real Stripe test objects. No real money.</footer></div></main><script>
const products=['PaymentIntents','Checkout','Payment Links','Invoicing','Issuing','Connect','Billing','Shared payment tokens','Agent Toolkit'];
const commands=['restock','create a checkout for the kitchen order','table for 6 Saturday 8pm','prepare an invoice for Agent Nine Demo 120 for catering','try eighty pounds at Ocado on the card','pay the venue sixty pounds','start a Sally Plus subscription','pay nine pounds sixty with a shared payment token','use Agent Toolkit to prepare an invoice for Agent Nine Tools 75 for services'];
const before=['Supplier payment pending.','Customer checkout pending.','Booking deposit link pending.','Customer invoice pending.','£80 card purchase pending. Card limit must be verified.','Venue payment pending.','New subscription pending.','Scoped token payment pending.','Toolkit invoice pending.'];
const $=s=>document.querySelector(s);let scene=0;let busy=false;window.lastResult=null;
function select(n){if(busy)return;scene=n;window.lastResult=null;$('h1').textContent=products[n];$('#command').value=commands[n];$('.state').textContent=before[n];$('.empty').hidden=false;$('pre').hidden=true;$('.audit').hidden=true;document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-current',String(i===n)));}
products.forEach((p,i)=>{let b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+'  '+p;b.onclick=()=>select(i);$('nav').appendChild(b)});
$('form').onsubmit=async e=>{e.preventDefault();busy=true;$('.send').disabled=true;$('.state').textContent='Sally is working on your request…';try{let r=await fetch('/api/agent9/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text:$('#command').value})});let j=await r.json();if(!r.ok||!j.proof)throw Error(j.error||'No verified proof available');window.lastResult=j;$('.state').textContent=j.reply;$('pre').textContent=JSON.stringify(j.proof,null,2);$('pre').hidden=false;$('.empty').hidden=true;if(j.audit){$('.audit').textContent='via: '+j.audit.via+'\n'+j.audit.operations.join(' · ');$('.audit').hidden=false}document.body.dataset.proof='ready';}catch(err){$('.state').textContent=err.message;document.body.dataset.proof='error'}finally{busy=false;$('.send').disabled=false}};
select(Math.max(0,Math.min(8,Number(new URLSearchParams(location.search).get('scene')||1)-1)));
</script></body></html>
